<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Box Sender • Log Package</title>
  
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/assets/Css/style.css" rel="stylesheet">

</head>
<body class="bg-light">
  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard.html">Box Sender</a>
        <div class="d-flex gap-2">
          <a class="btn btn-light btn-sm" href="/pickup.html">Pickup</a>
          <a class="btn btn-light btn-sm" href="/search.html">Search</a>
          <form method="post" action="/logout" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
          </form>
        </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-4">Log Package</h4>
        <!-- Log Package Form -->
        <form id="logForm">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label" for="trackingNumber">
                Tracking Number *
              </label>
              <input 
              name="trackingNumber" 
              id="trackingNumber" 
              class="form-control" 
              required placeholder="e.g., 1Z999AA10123456784">
            </div>
            
            <div class="col-md-6" bg-light>
              <label class="form-label" for="carrier">Carrier *</label>
              <select id="carrier" name="carrier" class="form-select" required>
                <option value="">Select carrier…</option>
                <option value="UPS">UPS</option>
                <option value="USPS">USPS</option>
                <option value="FedEx">FedEx</option>
                <option value="DHL">DHL</option>
                <option value="Amazon Logistics">Amazon Logistics</option>
                <option value="Other">Other</option>
              </select>
            </div>
            
            <div class="col-md-6">
              <label class="form-label" for="recipientFirstName">
                Recipient First Name *
              </label>
              <input 
              id="recipientFirstName" 
              name="recipientFirstName" 
              class="form-control" 
              required placeholder="e.g., Alex">
            </div>
            
            <div class="col-md-6">
              <label class="form-label" for="recipientLastName">
                Recipient Last Name
              </label>
              <input 
              id="recipientLastName" 
              name="recipientLastName" 
              class="form-control" 
              placeholder="e.g., Johnson">
            </div>
            
            <div class="col-md-6">
              <label class="form-label" for="recipientEmail">
                Recipient Email *
              </label>
              <input 
              id="recipientEmail" 
              name="recipientEmail" 
              class="form-control" 
              type="email" 
              placeholder="e.g., alex@company.com" 
              required>
            </div>
            
            <div class="col-12">
              <label class="form-label" for="description">
                Description (Optional)
              </label>
              <textarea 
              id="description" 
              name="description" 
              class="form-control" 
              rows="3" 
              placeholder="e.g., Package from supplier"
              ></textarea>
            </div>
          </div>
          
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit">
              Log Package
            </button>
            <button id="btnClear" type="reset" class="btn btn-outline-secondary">
              Clear All
            </button>
          </div>
        </form>
        
        <!-- Success/Error Message Area -->
        <div id="logResult" class="mt-3"></div>
      </div>
    </div>
  </main>

  
<!-- JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/log.js" defer></script>

</body>
</html>
