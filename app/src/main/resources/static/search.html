<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Box Sender • Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/Css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container d-flex align-items-center">
      <a class="navbar-brand" href="/dashboard.html">Box Sender</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-light btn-sm" href="/pickup.html">Pickup</a>
        <a class="btn btn-light btn-sm" href="/log.html">Log Package</a>
        <form method="post" action="/logout" class="m-0">
          <button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-4">
    <div class="card shadow">
      <div class="card-body">
        <h3 class="card-title mb-4">Search Packages</h3>
        
        <!-- THREE FILTER BOXES -->
        <div class="row g-3 mb-4">
          <!-- Tracking Number Filter -->
          <div class="col-md-4">
            <label class="form-label" for="trackingFilter">
              Tracking Number
            </label>
            <input 
              id="trackingFilter" 
              class="form-control" 
              placeholder="e.g., ABC123"
            />
            <small class="text-muted">Leave empty to show all</small>
          </div>

          <!-- Recipient Name Filter -->
          <div class="col-md-4">
            <label class="form-label" for="recipientFilter">
              Recipient Name
            </label>
            <input 
              id="recipientFilter" 
              class="form-control" 
              placeholder="e.g., John Doe"
            />
            <small class="text-muted">First or last name</small>
          </div>

          <!-- Status Filter -->
          <div class="col-md-4">
            <label class="form-label" for="statusFilter">
              Status
            </label>
            <select id="statusFilter" class="form-select">
              <option value="all">All Statuses</option>
              <option value="received">Received (Ready for Pickup)</option>
              <option value="picked_up">Picked Up</option>
            </select>
          </div>
        </div>

        <!-- Search Button -->
        <div class="d-flex gap-2 mb-4">
          <button id="searchBtn" class="btn btn-primary">
            Search Packages
          </button>
          <button id="clearBtn" class="btn btn-secondary">
            Clear Filters
          </button>
        </div>

        <!-- Results Count -->
        <div id="resultCount" class="mb-2 text-muted"></div>

        <!-- Results Table -->
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light">
              <tr>
                <th>Tracking #</th>
                <th>Carrier</th>
                <th>Recipient</th>
                <th>Status</th>
                <th>Logged At</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr>
                <td colspan="6" class="text-center text-muted py-4">
                  Enter your search filters above and click "Search Packages"
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/search.js"></script>
</body>
</html>
