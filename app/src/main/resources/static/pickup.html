<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Box Sender • Pickup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/Css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container d-flex align-items-center">
      <a class="navbar-brand" href="/dashboard.html"> Box Sender</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-light btn-sm" href="/search.html"> Search</a>
        <a class="btn btn-light btn-sm" href="/log.html"> Log Package</a>
        <form method="post" action="/logout" class="m-0">
          <button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="card-title mb-4">Package Pickup</h3>

          <!-- Pickup Form -->
            <form id="pickupForm">
              <!-- Tracking Number (Read-only, pre-filled) -->
              <div class="mb-3">
                <label class="form-label" for="trackingNumber">
                  Tracking Number *
                </label>
                <input 
                  id="trackingNumber" 
                  name="trackingNumber"
                  class="form-control" 
                  placeholder="Enter tracking number"
                  required 
                  readonly
                />
              </div>
              
              <!-- Recipient Name (Read-only, pre-filled) -->
              <div class="mb-3">
                <label class="form-label" for="pickedUpBy">
                   Your Full Name *
                </label>
                <input 
                  id="pickedUpBy"
                  name="pickedUpBy" 
                  class="form-control" 
                  placeholder="e.g., John Doe"
                  required
                  readonly
                />
              </div>
              
              <!-- Signature (User must type) -->
              <div class="mb-3">
                <label class="form-label" for="signature">
                  Signature (Type your name) *
                </label>
                <input 
                  id="signature"
                  name="signature" 
                  class="form-control form-control-lg"
                  placeholder="Type your full name as signature"
                  required
                  style="font-family: 'Brush Script MT', cursive; font-size: 24px;"
                  autofocus
                />
                <small class="text-muted">
                  By typing your name, you confirm receipt of this package
                </small>
              </div>
              <!-- Submit Button -->
              <div class="d-grid gap-2"></div>
              <button class="btn btn-success w-100 btn-lg" type="submit">
                Confirm Pickup
              </button>
              </a>
            </div>
            </form>

            <!-- Message area -->
            <div id="messageArea" class="mt-3"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/pickup.js"></script>
</body>
</html>
