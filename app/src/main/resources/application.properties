spring.datasource.url=jdbc:mysql://localhost:3307/boxsender
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

# Brevo SMTP Configuration (set environment variables to enable email features)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
brevo.from.email=tenzinkunga31@gmail.com
brevo.from.name=Box Sender
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.com.boxsender=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG